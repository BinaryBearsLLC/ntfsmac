name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  shell-tests:
    name: shellcheck + bats
    runs-on: macos-26 # arm64 (Apple Silicon) runner — required, no Intel fallback (L7)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install shellcheck + bats-core
        run: brew install shellcheck bats-core
      - name: shellcheck
        run: |
          # *.command (build.command, PR #14's interactive release builder) is bash too —
          # security-relevant (codesign, xattr), so lint it alongside the .sh scripts.
          # Ask Git for the inputs so local-only testers and generated caches can never alter
          # this gate or accidentally become part of the release surface.
          git ls-files -z -- '*.sh' '*.command' ':(exclude)vendor/src/**' \
            | xargs -0 shellcheck -S warning
      - name: Install build dependencies
        run: |
          brew install llvm lld umoci xz util-linux gettext pkg-config
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - name: bats
        run: tests/run-all.sh

  rust-tests:
    name: cargo test (vendored crates)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          brew install llvm lld xz util-linux gettext pkg-config
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
      - name: Run Rust tests
        run: ./vendor/src/anylinuxfs/run-rust-tests.sh

  swift-build:
    name: Swift GUI tests (standard + Legacy)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test standard SMAppService distribution
        run: >-
          ./build/run-swift-tests.sh modern
          "$RUNNER_TEMP/ntfsmac-modern-tests"
          --disable-sandbox
      - name: Test Legacy SMJobBless distribution
        run: >-
          ./build/run-swift-tests.sh legacy
          "$RUNNER_TEMP/ntfsmac-legacy-tests"
          --disable-sandbox
